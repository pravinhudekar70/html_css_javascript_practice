<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        body{
            background-color: rgba(0, 0, 0, 0.418);
        }
        img {
            width: 150px;
            height: 150px;
            cursor: pointer;
            margin: 5px;
            border: 2px solid rgba(0, 0, 0, 0.541);
        }
        img:hover{
            border: 3px solid rgb(98, 98, 202);
            background-color: aquamarine;
        }


        #div1 {
            text-align: center;
            color: white;
        }

        #demo {
            height: 500px;
            width:80%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #demo img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="div1">
        <h1>Photo Gallery</h1>
        <img class="gallery-img" src="/JavaScript/Project 2/images/img1.jpg" alt="Image 1">
        <img class="gallery-img" src="/JavaScript/Project 2/images/img2.jpg" alt="Image 2">
        <img class="gallery-img" src="/JavaScript/Project 2/images/img3.jpg" alt="Image 3">
        <img class="gallery-img" src="/JavaScript/Project 2/images/img4.jpg" alt="Image 4">
        <img class="gallery-img" src="/JavaScript/Project 2/images/img5.jpg" alt="Image 5">
    </div>

    <div id="demo"></div>

    <script>
        document.querySelectorAll(".gallery-img").forEach(img => {
            img.addEventListener("mouseover", function () {
                document.getElementById("demo").innerHTML = 
                    `<img src="${this.src}" alt="loading">`;
            });
        });
    </script>

</body>

</html>
