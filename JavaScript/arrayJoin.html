<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array join</title>
</head>
<body>
    <h1>Array Join</h1>
    <p id="arr1"></p><br>

    <p id="arr2"></p><br>

    <p id="join"></p><br>

    <Script>
        var arr1 =[3,5,7,8,2,1,9];
        var arr2=[19,22,43,45,-33];

        document.getElementById("arr1").innerHTML="Array1: "+arr1;
        document.getElementById("arr2").innerHTML="Array2: "+arr2;
        document.getElementById("join").innerHTML="join of Arrays: "+
        arr1.concat(arr2);

    </Script>

</body>
</html>
