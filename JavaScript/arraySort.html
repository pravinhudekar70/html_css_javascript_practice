<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Array</title>
</head>
<body>
    <h1>Array Sorting </h1>
    <p id="fruits"></p> <br>
    <p id="sort"></p> <br>
    <script>
         let fruits = ["Apple", "Orange", "Pear", "Grape", "Banana", "Mango"];
         document.getElementById("fruits").innerHTML= "fruits = "+fruits.toString()
         +"<br> ...................................."

         document.getElementById("sort").innerHTML="sorted :"+ fruits.sort();

    </script>
    
</body>
</html>
