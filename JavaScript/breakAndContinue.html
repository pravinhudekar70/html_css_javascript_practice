<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break And Continue</title>
</head>

<body>
    <h1>
        Break And Continue
    </h1>
    <script>
        var a = 1;
        for(a;a<20;a++){
            if(a==3)
            continue;
        if(a == 16)
        break;
            document.write(a);
            document.write("<br>");
        }
    </script>
</body>

</html>
