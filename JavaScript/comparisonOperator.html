<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use of Comparison Operators</title>
</head>

<body>
    <h1>Comparison Operators</h1>
    <div>
        <p id="p1"></p><br>

        <p id="p2"></p><br>

        <p id="p3"></p><br>

        <p id="p4"></p><br>

        <p id="p5"></p><br>

    </div>
    <script>
        var a = 28;
        var b = 38;
        document.getElementById("p1").innerHTML = "a = " + a + "<br> b = " + b + "<br>.....................";
        document.getElementById("p2").innerHTML = "a < b = " + (a < b) + "<br>...............";
        document.getElementById("p3").innerHTML = "a > b = " + (a > b) + "<br>...............";
        document.getElementById("p4").innerHTML = "a == b = " + (a == b) + "<br>...............";
        document.getElementById("p5").innerHTML = "a != b = " + (a != b) + "<br>...............";
    </script>
</body>

</html>
