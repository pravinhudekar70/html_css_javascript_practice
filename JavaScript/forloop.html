<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for loop </title>

</head>

<body>

    <h1>
        use of for loop
    </h1>
    <script>
        var i = 1;
        for (i; i <= 10; i++) {
            document.write(i);
            document.write("<br>");
        }
        document.write("<br>")
        var arr = ["hi", "hello", "my", "name", "is"];
        for (let a in arr) {
            document.write(arr[a]);
            document.write("<br>");
        }

    </script>
</body>

</html>
