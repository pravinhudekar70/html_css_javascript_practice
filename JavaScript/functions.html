<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions </title>
</head>

<body>
    <h1>JavaScript Functions </h1>
    <div>
        <p id="demo"></p>
    </div>
    <script>
        function mult(a, v){
            return a*v;
        }
        document.getElementById("demo").innerHTML= "use of function = "+ mult(2,5);
    </script>
</body>

</html>
