<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Else Statement</title>
</head>

<body>
    <h1>If Else Statements</h1>
    <div>
        <p></p>
    </div>
    <script>
        var marks = 110;
        if (marks < 50)
            document.write("fail");
        else if (marks < 60)
            document.write("D");
        else if (marks < 70)
            document.write("C");
        else if (marks < 80)
            document.write("B")
        else if (marks < 90)
            document.write("A");
        else if (marks < 100)
            document.write("A+");
        else
            document.write("Score must be less than 100");
    </script>
</body>

</html>
