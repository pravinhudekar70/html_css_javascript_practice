<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Color Changer</title>
</head>

<body>
    <h1>Background Color Changer</h1>

    <script>

        var bgcolor = ["#FF5733", "#3498DB", "#2ECC71", "#F39C12", "#9B59B6", "#16A085", "#F4D03F"];


        document.body.style.backgroundColor = bgcolor[Math.floor(Math.random() * bgcolor.length)];
    </script>
</body>

</html>
